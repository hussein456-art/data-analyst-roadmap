<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خريطة طريق تحليل البيانات - حسين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10141A;
    --surface:#181F28;
    --surface-2:#1F2833;
    --line:#2A3340;
    --text:#EEF1F5;
    --text-2:#8B96A5;
    --text-3:#5C6572;
    --teal:#33D6A8;
    --teal-dim:#1B4E42;
    --amber:#F2A93B;
    --amber-dim:#4A3A1A;
    --coral:#FF6E5A;
    --coral-dim:#4A251F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    line-height:1.7;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- Header ---------- */
  .hero{
    padding:56px 24px 40px;
    max-width:760px;
    margin:0 auto;
    text-align:center;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:2px;
    color:var(--teal);
    text-transform:uppercase;
  }
  .hero h1{
    font-size:34px;
    font-weight:800;
    margin:10px 0 8px;
  }
  .hero p{
    color:var(--text-2);
    font-size:15px;
    margin:0 0 28px;
  }
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 20px;
  }
  .progress-track{
    flex:1;
    height:8px;
    background:var(--surface-2);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--teal),#5EEAC4);
    border-radius:999px;
    transition:width .5s ease;
  }
  .progress-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--text-2);
    white-space:nowrap;
  }

  /* ---------- Rail / stations ---------- */
  .rail-container{
    max-width:760px;
    margin:0 auto;
    padding:20px 24px 80px;
    position:relative;
  }
  .rail-container::before{
    content:'';
    position:absolute;
    top:28px;
    bottom:60px;
    right:47px;
    width:2px;
    background:var(--line);
  }
  .station{
    position:relative;
    display:flex;
    gap:20px;
    margin-bottom:18px;
  }
  .station-marker{
    flex:none;
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--surface);
    border:2px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:18px;
    color:var(--text-3);
    z-index:1;
    transition:all .3s ease;
  }
  .station-marker.done{
    background:var(--teal-dim);
    border-color:var(--teal);
    color:var(--teal);
  }
  .station-marker.progress{
    background:var(--amber-dim);
    border-color:var(--amber);
    color:var(--amber);
  }
  .station-card{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 22px;
  }
  .station-card.outcome{
    border-color:var(--coral);
  }
  .station-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    flex-wrap:wrap;
  }
  .station-title{
    font-size:19px;
    font-weight:700;
    margin:0 0 4px;
  }
  .station-sub{
    color:var(--text-2);
    font-size:13.5px;
    margin:0;
  }
  .station-pct{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-3);
    background:var(--surface-2);
    padding:4px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .courses{
    margin-top:16px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .course-link{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    text-decoration:none;
    color:var(--text);
    font-size:14px;
    transition:border-color .2s;
  }
  .course-link:hover{border-color:var(--teal);}
  .course-link .yt{
    flex:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--coral);
    border:1px solid var(--coral-dim);
    background:var(--coral-dim);
    padding:2px 6px;
    border-radius:5px;
  }
  .course-meta{color:var(--text-3);font-size:12.5px;}

  .tasks{
    margin-top:16px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .task{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 4px;
    cursor:pointer;
    border-radius:8px;
  }
  .task:hover{background:var(--surface-2);}
  .task input{
    width:18px;height:18px;
    accent-color:var(--teal);
    flex:none;
    cursor:pointer;
  }
  .task span{
    font-size:14px;
    color:var(--text);
  }
  .task.checked span{
    color:var(--text-3);
    text-decoration:line-through;
  }
  .note{
    margin-top:14px;
    font-size:12.5px;
    color:var(--text-3);
    border-right:2px solid var(--line);
    padding-right:10px;
  }

  @media (max-width:560px){
    .rail-container::before{right:27px;}
    .station-marker{width:40px;height:40px;font-size:14px;}
    .station{gap:12px;}
    .hero h1{font-size:26px;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="eyebrow">DATA ANALYST TRACK</div>
  <h1>خُطَّةُ طَرِيقِ تَحْلِيلِ البَيَانَاتِ - حسين</h1>
  <p>سبع محطات من الصفر لحد أول وظيفة. اعمل تيك على كل مهمة تخلصها وهيتسجلّك تقدمك تلقائي.</p>
  <div class="progress-wrap">
    <span class="progress-label" id="progressLabel">0 / 0</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressPct">0%</span>
  </div>
</div>

<div class="rail-container" id="rail"></div>

<script>
const STAGES = [
  {
    id:'s1', title:'الأساسيات: إكسل والإحصاء', sub:'افهم شكل البيانات قبل أي حاجة تانية',
    courses:[
      {title:'كورس تحليل البيانات بالإكسل', channel:'قناة اتعلم مع العسال', url:'https://www.youtube.com/playlist?list=PLXlHqMRg9lAbetpJy3ePXsN0sj9Zs-pvT'}
    ],
    tasks:[
      'اتعلم Pivot Tables والدوال الأساسية في إكسل',
      'افهم المتوسط والوسيط والانحراف المعياري',
      'اعمل أول تقرير بسيط في إكسل من بيانات حقيقية'
    ]
  },
  {
    id:'s2', title:'SQL وقواعد البيانات', sub:'أهم مهارة هتفتحلك باب الشغل',
    courses:[
      {title:'دورة SQL كاملة للمبتدئين بالعربي', channel:'Korsat X Parmaga', url:'https://www.youtube.com/playlist?list=PLxbVBWjVdAEj8TmOUKPG0avUmLqSoQOpf'}
    ],
    tasks:[
      'اتعلم SELECT وWHERE وORDER BY',
      'اتعلم أنواع JOIN المختلفة',
      'اتعلم GROUP BY وWindow Functions',
      'حل تمارين على HackerRank SQL'
    ]
  },
  {
    id:'s3', title:'Python للتحليل', sub:'Pandas وNumPy هما سلاحك الأساسي',
    courses:[
      {title:'كورس تحليل البيانات من الصفر - جزء بايثون', channel:'يوتيوب عربي', url:'https://www.youtube.com/playlist?list=PLonOrMR73lKiRTVZ65tKXwczwi09qzlUt'},
      {title:'محتوى بايثون لتحليل البيانات', channel:'Stat Academy', url:'https://statacademy-eg.com'}
    ],
    tasks:[
      'اتعلم أساسيات بايثون: المتغيرات والحلقات والدوال',
      'اتعلم مكتبة Pandas: قراءة البيانات وتنظيفها',
      'ارسم بمكتبة Matplotlib أو Seaborn'
    ]
  },
  {
    id:'s4', title:'تنظيف وتحليل البيانات (EDA)', sub:'دوّر على القصة اللي البيانات بتحكيها',
    courses:[],
    tasks:[
      'تعامل مع القيم الناقصة (missing values)',
      'اكتشف القيم الشاذة (outliers)',
      'حلل العلاقة بين المتغيرات (correlation)',
      'اطلع بخلاصة واضحة من كل تحليل تعمله'
    ]
  },
  {
    id:'s5', title:'أدوات التصور المرئي: Power BI', sub:'حوّل الأرقام لصورة تتفهم في ثانية',
    courses:[
      {title:'كورس Power BI من الصفر', channel:'قناة اتعلم مع العسال', url:'https://www.youtube.com/playlist?list=PLXlHqMRg9lAZPJ5loaPck60I91kAwMhT3'}
    ],
    tasks:[
      'اتعلم تجهيز البيانات بـ Power Query',
      'اتعلم أساسيات لغة DAX',
      'ابني أول Dashboard تفاعلي كامل'
    ]
  },
  {
    id:'s6', title:'مشاريع بورتفوليو حقيقية', sub:'من غير مشاريع مفيش حد هيوظفك', outcome:true,
    courses:[],
    tasks:[
      'اختار 3 داتا سيتس مختلفة من Kaggle',
      'اعمل تحليل كامل: تنظيف + EDA + داشبورد لكل مشروع',
      'ارفع المشاريع على GitHub',
      'اكتب بوست على LinkedIn يشرح كل مشروع'
    ]
  },
  {
    id:'s7', title:'البحث عن وظيفة', sub:'وقت إنك تطلع للسوق', outcome:true,
    courses:[],
    tasks:[
      'جهز سيرة ذاتية تركز على المشاريع مش بس المهارات',
      'ابني بروفايل LinkedIn قوي',
      'قدم يوميًا على Wuzzuf وLinkedIn',
      'جهز نفسك لأسئلة الإنترفيو التقنية الشائعة'
    ]
  }
];

let progress = {};

function loadProgress(){
  try{
    const savedData = localStorage.getItem('roadmap-progress');
    progress = savedData ? JSON.parse(savedData) : {};
  }catch(e){ 
    progress = {}; 
  }
  render();
}

function saveProgress(){
  try{ 
    localStorage.setItem('roadmap-progress', JSON.stringify(progress)); 
  }catch(e){ 
    console.error('save failed', e); 
  }
}

function toggleTask(taskId){
  progress[taskId] = !progress[taskId];
  saveProgress();
  render();
}

function render(){
  const rail = document.getElementById('rail');
  rail.innerHTML = '';
  let totalTasks = 0, doneTasks = 0;

  STAGES.forEach((stage, idx) => {
    const stageTaskIds = stage.tasks.map((_, i) => stage.id + '-' + i);
    const stageDone = stageTaskIds.filter(id => progress[id]).length;
    totalTasks += stageTaskIds.length;
    doneTasks += stageDone;
    const pct = stageTaskIds.length ? Math.round(stageDone / stageTaskIds.length * 100) : 0;

    const station = document.createElement('div');
    station.className = 'station';

    const marker = document.createElement('div');
    marker.className = 'station-marker' + (pct === 100 ? ' done' : pct > 0 ? ' progress' : '');
    marker.textContent = pct === 100 ? '✓' : (idx + 1);
    station.appendChild(marker);

    const card = document.createElement('div');
    card.className = 'station-card' + (stage.outcome ? ' outcome' : '');

    const top = document.createElement('div');
    top.className = 'station-top';
    top.innerHTML = `
      <div>
        <div class="station-title">${stage.title}</div>
        <p class="station-sub">${stage.sub}</p>
      </div>
      <span class="station-pct mono">${stageDone}/${stageTaskIds.length}</span>
    `;
    card.appendChild(top);

    if(stage.courses.length){
      const coursesEl = document.createElement('div');
      coursesEl.className = 'courses';
      stage.courses.forEach(c => {
        const a = document.createElement('a');
        a.href = c.url; a.target = '_blank'; a.rel = 'noopener';
        a.className = 'course-link';
        a.innerHTML = `<span class="yt">YT</span><span>${c.title}<br><span class="course-meta">${c.channel}</span></span>`;
        coursesEl.appendChild(a);
      });
      card.appendChild(coursesEl);
    }

    const tasksEl = document.createElement('div');
    tasksEl.className = 'tasks';
    stage.tasks.forEach((label, i) => {
      const taskId = stage.id + '-' + i;
      const checked = !!progress[taskId];
      const row = document.createElement('label');
      row.className = 'task' + (checked ? ' checked' : '');
      row.innerHTML = `<input type="checkbox" ${checked ? 'checked' : ''}><span>${label}</span>`;
      row.querySelector('input').addEventListener('change', () => toggleTask(taskId));
      tasksEl.appendChild(row);
    });
    card.appendChild(tasksEl);

    if(!stage.courses.length && !stage.outcome){
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = 'المرحلة دي بتتطبق جنب مرحلة بايثون، مفيهاش كورس منفصل.';
      card.appendChild(note);
    }

    station.appendChild(card);
    rail.appendChild(station);
  });

  document.getElementById('progressLabel').textContent = doneTasks + ' / ' + totalTasks;
  const overallPct = totalTasks ? Math.round(doneTasks / totalTasks * 100) : 0;
  document.getElementById('progressPct').textContent = overallPct + '%';
  document.getElementById('progressFill').style.width = overallPct + '%';
}

loadProgress();
</script>

</body>
</html>
